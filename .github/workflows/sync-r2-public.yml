name: 自动同步R2并使用DeepSeek生成美化表格

on:
  schedule:
    - cron: '0 * * * *' # 每小时自动跑一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-public-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 rclone 和 Python
        run: |
          curl https://rclone.org/install.sh | sudo bash
          python3 -m pip install --upgrade pip
          pip install requests

      - name: 配置 R2 连接
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          EOF

      - name: 使用 DeepSeek 整合文件列表
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 获取所有文件列表，保存到 all_files.txt
          rclone lsf r2:public-assets --recursive > all_files.txt
          
          # 运行我们写好的 Python 脚本
          python3 process.py

      - name: 自动提交到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "无变化，跳过提交。"
          else
            git commit -m "DeepSeek自动整合并更新下载列表"
            git push
          fi
