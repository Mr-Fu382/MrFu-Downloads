name: 自动同步R2公开桶并生成下载表格

on:
  schedule:
    # 每小时的第 0 分钟自动运行一次
    - cron: '0 * * * *'
  workflow_dispatch: # 允许你随时在网页上手动触发

# 赋予脚本提交和推送代码的权限
permissions:
  contents: write

jobs:
  update-download-list:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: 配置 R2 连接
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          EOF

      - name: 获取 R2 文件列表
        run: |
          echo "正在拉取 R2 文件列表..."
          rclone lsf r2:public-assets --recursive > all_files.txt
          echo "获取完成，共 $(wc -l < all_files.txt) 个文件。"

      - name: 执行 Python 生成表格脚本
        # 注意：这里的路径已修改为隐藏目录下的 scripts 文件夹
        run: python .github/scripts/process.py

      - name: 清理临时文件
        # 跑完后立刻删掉，防止被提交到仓库
        run: rm -f all_files.txt

      - name: 自动提交并推送到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          
          # 检测是否有变化，如果没有变化就不产生空的提交记录
          if git diff --staged --quiet; then
            echo "没有检测到变化，跳过提交。"
          else
            git commit -m "自动更新 R2 下载列表"
            git push
          fi
